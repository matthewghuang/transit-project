services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    container_name: zookeeper-transit
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  kafka:
    image: confluentinc/cp-kafka:7.0.1
    container_name: kafka-transit
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # IMPORTANT: Limit Kafka JVM heap size for 1GB RAM VM
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx256M"
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 256M

  mongo:
    image: mongo
    restart: always
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    command: ["--wiredTigerCacheSizeGB", "0.25"] # Limit MongoDB cache
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  timescale:
    image: timescale/timescaledb:latest-pg17
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: transit
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 256M

  db-init:
    build: .
    container_name: db-init-transit
    command: ["python", "db_init.py"]
    depends_on:
      - timescale
    environment:
      POSTGRES_HOST: timescale
      POSTGRES_DB: transit
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # Optional: You might want to disable mongo-express on a B1s to save RAM
  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
    depends_on:
      - mongo
    deploy:
      resources:
        limits:
          memory: 64M
